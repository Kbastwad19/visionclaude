<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aside — a voice in your ear, with a sharper mind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,400&family=Newsreader:ital,wght@0,400;1,400&display=swap" />
  <style>
    :root { --display-font: 'Instrument Serif', serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; overflow-x: hidden; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    a { color: inherit; }
    a:hover { opacity: 0.65; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes liveDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes lineIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes wave {
      0%, 100% { height: 4px; }
      50%      { height: 22px; }
    }
    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes rotateCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes pulseRing {
      0%   { transform: scale(0.9); opacity: 0.7; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    .shimmer-text {
      background: linear-gradient(90deg, currentColor 0%, currentColor 40%, var(--accent, #6FE3A8) 50%, currentColor 60%, currentColor 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 5s linear infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }
    button:focus-visible, input:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    ::selection { background: #6FE3A8; color: #1A1714; }

    /* Responsive hero — stack columns on narrow viewports */
    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 80px;
      align-items: center;
    }
    .hero-grid.centered { grid-template-columns: 1fr; gap: 56px; }
    @media (max-width: 1100px) {
      .hero-grid { grid-template-columns: 1fr !important; gap: 48px; }
    }
    .hero-h1 {
      font-family: var(--display-font);
      font-size: clamp(40px, 5.4vw, 88px);
      line-height: 0.98;
      letter-spacing: -0.025em;
      font-weight: 400;
      margin: 0 0 28px;
      text-wrap: balance;
    }
    @media (max-width: 700px) {
      .hero-h1 { font-size: clamp(34px, 8vw, 56px); line-height: 1.02; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="flow.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
